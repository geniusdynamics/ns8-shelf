# nginx gateway of the Shelf pod. Copied to state/gateway/ by bin/render-env
# at every start of the module.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Everything Shelf needs, shared by the two listeners below
# (include path: this directory is mounted at /etc/nginx/conf.d)
#
# 8000: published on the loopback interface by the pod, Traefik forwards here.
# 443:  reachable from inside the pod only. The pod resolves the public host
#       name to 127.0.0.1, so the server side of Shelf talks to Supabase Auth
#       and Storage without leaving the pod: no dependency on DNS, on the
#       Traefik certificate or on the network. The certificate is generated
#       by bin/render-env and trusted by the Shelf container only.
server {
    listen 8000 default_server;
    server_name _;
    include /etc/nginx/conf.d/shelf-locations.inc;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/conf.d/shelf-locations.inc;
}

# Internal only: this port is not published by the pod. Supabase Auth
# downloads its e-mail templates from here.
server {
    listen 127.0.0.1:8001;
    server_name _;
    access_log off;

    location /mail/ {
        alias /etc/nginx/conf.d/mail/;
        default_type text/html;
    }
}

#
# Files and volumes saved by Restic during the module backup.
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
# - shelf.pg_dump: consistent dump of the "shelf" database (Shelf data plus
#   Supabase Auth and Storage metadata), created by bin/module-dump-state.
#   The live postgres-data volume is deliberately NOT saved: a copy of a
#   running database is not consistent, the dump is restored instead.
# - passwords.env, settings.env: generated secrets and settings, they must
#   survive a restore, otherwise sessions and access keys would be invalidated.
# - storage-data: the uploaded files.
#

state/shelf.pg_dump
state/passwords.env
state/settings.env
volumes/storage-data
